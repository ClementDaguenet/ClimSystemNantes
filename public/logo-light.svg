    <path d="M 100 12 H 220 a12 12 0 0 1 12 12 V 232 a12 12 0 0 1 -12 12 H 100 V 12 Z" fill="#1e6fd9"/>

    <g fill="white" stroke="white" stroke-linecap="round" stroke-linejoin="round">
